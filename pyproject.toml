[project]
name = "hhgoa-fraud-agent"
version = "0.1.0"
description = "Agentic fraud investigation on TigerGraph (Hacker House Goa 2026): GSQL query library, TigerGraph MCP tools, GraphRAG, policy-gated next-best-action, Streamlit analyst UI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Aryan Gupta" }]

# Every pin verified on PyPI on 2026-09-19 (name -> latest version, requires-python):
#   tigergraph-mcp 1.0.3 (>=3.10)  pyTigerGraph 2.0.4 (>=3.8)  anthropic 1.7.0 (>=3.10; extra "mcp" -> mcp<3,>=1.0)
#   mcp 2.2.0  voyageai 0.5.0 (<3.15,>=3.9)  duckdb 1.5.5  lightgbm 4.7.0  scikit-learn 1.9.1 (>=3.11)
#   pandas 3.0.6 (>=3.11)  pyarrow 25.0.1  streamlit 1.64.0  pydantic 2.13.5  PyYAML 6.0.3  RapidFuzz 3.14.6 (>=3.11)
#   python-dotenv 1.2.3  pytest 9.1.1  ruff 0.16.8  streamlit-agraph 0.0.45  pyvis 0.3.2
dependencies = [
  "tigergraph-mcp==1.0.3",
  "pyTigerGraph==2.0.4",
  "anthropic[mcp]>=1.7.0,<2",
  "mcp>=1.0,<3",
  "voyageai>=0.5.0,<0.6",
  "duckdb>=1.5,<2",
  "lightgbm>=4.7,<5",
  "scikit-learn>=1.9,<2",
  "pandas>=3.0,<4",
  "pyarrow>=25,<26",
  "streamlit>=1.64,<2",
  "streamlit-agraph>=0.0.45",
  "pyvis>=0.3.2,<0.4",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.14,<4",
  "python-dotenv>=1.2,<2",
  "numpy>=2,<3",
  "requests>=2.32,<3",
  # Terminal rendering for every CLI in the repo. Already present transitively (typer -> rich>=13.8.0,
  # mcp[rich] -> rich>=13.9.4, streamlit[all] -> rich>=11.0.0); made explicit so it cannot vanish on a
  # re-resolve. Lower bound is the highest of those transitive floors. Only ops/console.py may import it.
  "rich>=13.9.4,<16",
  "sentence-transformers>=6.1.0",
  "claude-agent-sdk>=0.2.157",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=0.23",
  "ruff>=0.16,<1",
]

[tool.uv]
# `uv sync --extra dev` installs the dev group; `uv run <cmd>` uses the project env.
package = false

[tool.ruff]
line-length = 200
target-version = "py312"
extend-exclude = ["data", "runs", "cases", "cases_monitoring", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]
"ui/pages/*.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q -p no:cacheprovider"
markers = ["live: needs a TigerGraph workspace and .env (deselected in CI)"]
filterwarnings = ["ignore::DeprecationWarning"]
